<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FBF8F3" />
    <meta name="description" content="WorkToon · 把每天的工作日志变成属于你的漫画" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WorkToon" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>WorkToon · 工作日志漫画</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #fbf8f3;
        color: #2b2620;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        display: grid;
        place-items: center;
      }
      .boot {
        text-align: center;
      }
      .mark {
        width: 44px;
        height: 44px;
        margin: 0 auto 12px;
        border-radius: 12px;
        background: linear-gradient(135deg, #e8813a, #7c6bd6);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .t {
        font-size: 16px;
        font-weight: 700;
      }
      .s {
        font-size: 12.5px;
        color: #9d938a;
        margin-top: 4px;
      }
    </style>
    <script>
      /* 恒定引导页：内容永不改动，只负责把用户送到带时间戳的真身上。
         这样即使本页被浏览器缓存，也总能拿到最新一版应用。 */
      (function () {
        try {
          var hash = location.hash || ''
          location.replace('./app.html?t=' + Date.now() + hash)
        } catch (e) {
          location.href = './app.html'
        }
      })()
    </script>
  </head>
  <body>
    <div class="boot">
      <div class="mark"></div>
      <div class="t">WorkToon</div>
      <div class="s">工作日志漫画 · 正在加载…</div>
      <noscript><a href="./app.html" style="color: #e8813a">进入 WorkToon</a></noscript>
    </div>
  </body>
</html>
