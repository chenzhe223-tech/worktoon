        <line x1="386" y1="676" x2="460" y2="676"/><line x1="386" y1="690" x2="460" y2="690"/>
        <line x1="386" y1="704" x2="460" y2="704"/><line x1="386" y1="718" x2="460" y2="718"/>
        <line x1="386" y1="732" x2="460" y2="732"/>
        <line x1="464" y1="620" x2="538" y2="620"/><line x1="464" y1="634" x2="538" y2="634"/>
        <line x1="464" y1="648" x2="538" y2="648"/><line x1="464" y1="662" x2="538" y2="662"/>
        <line x1="464" y1="676" x2="538" y2="676"/><line x1="464" y1="690" x2="538" y2="690"/>
        <line x1="464" y1="704" x2="538" y2="704"/><line x1="464" y1="718" x2="538" y2="718"/>
        <line x1="464" y1="732" x2="538" y2="732"/>
        <line x1="542" y1="620" x2="616" y2="620"/><line x1="542" y1="634" x2="616" y2="634"/>
        <line x1="542" y1="648" x2="616" y2="648"/><line x1="542" y1="662" x2="616" y2="662"/>
        <line x1="542" y1="676" x2="616" y2="676"/><line x1="542" y1="690" x2="616" y2="690"/>
        <line x1="542" y1="704" x2="616" y2="704"/><line x1="542" y1="718" x2="616" y2="718"/>
        <line x1="542" y1="732" x2="616" y2="732"/>
