  <rect x="70" y="90" width="660" height="330" rx="6" fill="#DCEBF2" stroke="#8FA9B8" stroke-width="4"/>
  <g clip-path="url(#winClip)">
    <rect x="70" y="90" width="660" height="330" fill="#CDE3EE"/>
    <circle cx="180" cy="140" r="26" fill="#FFF4D6"/>
    <path d="M70 340 L180 300 L260 325 L360 280 L470 320 L560 290 L660 315 L730 295 L730 420 L70 420 Z" fill="#B7CDB8" opacity="0.9"/>
    <path d="M70 370 L160 345 L280 365 L420 335 L560 360 L730 340 L730 420 L70 420 Z" fill="#A8C3A0"/>
    <rect x="520" y="220" width="60" height="120" fill="#C9A988" opacity="0.7"/>
