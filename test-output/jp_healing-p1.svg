    <rect x="450" y="776" width="100" height="8" rx="3" fill="#5E6B72" stroke="#6B4F3A" stroke-width="3"/>
  </g>

  <!-- printed sheets spread on desk -->
  <g stroke="#6B4F3A" stroke-width="2">
    <rect x="215" y="742" width="96" height="70" rx="3" fill="#FBF6E8" transform="rotate(-6 263 777)"/>
    <g transform="rotate(-6 263 777)" stroke="#C4B49A" stroke-width="1.5">
      <line x1="226" y1="758" x2="300" y2="758"/><line x1="226" y1="768" x2="300" y2="768"/>
      <line x1="226" y1="778" x2="300" y2="778"/><line x1="226" y1="788" x2="288" y2="788"/>
    </g>
    <rect x="262" y="748" width="96" height="70" rx="3" fill="#FBF6E8" transform="rotate(4 310 783)"/>
    <g transform="rotate(4 310 783)" stroke="#C4B49A" stroke-width="1.5">
      <line x1="274" y1="764" x2="346" y2="764"/><line x1="274" y1="774" x2="346" y2="774"/>
      <line x1="274" y1="784" x2="346" y2="784"/><line x1="274" y1="794" x2="330" y2="794"/>
    </g>
  </g>
  <!-- calculator -->
  <g stroke="#6B4F3A" stroke-width="2">
    <rect x="322" y="806" width="52" height="34" rx="4" fill="#5E6B72" transform="rotate(-4 348 823)"/>
    <rect x="329" y="811" width="38" height="10" rx="2" fill="#CFE3D2" transform="rotate(-4 348 823)"/>
    <g fill="#C9CFCB" stroke="none" transform="rotate(-4 348 823)">
