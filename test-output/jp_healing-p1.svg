      <rect x="386" y="604" width="74" height="14" fill="url(#greenRow)"/>
      <rect x="464" y="604" width="74" height="14" fill="url(#greenRow)"/>
      <rect x="542" y="604" width="74" height="14" fill="url(#greenRow)"/>
      <rect x="386" y="728" width="74" height="18" fill="#D8A88A" opacity="0.6"/>
      <rect x="464" y="728" width="74" height="18" fill="#D8A88A" opacity="0.35"/>
      <rect x="542" y="728" width="74" height="18" fill="#D8A88A" opacity="0.5"/>
      <rect x="470" y="648" width="40" height="12" fill="#A8C3A0"/>
      <rect x="392" y="676" width="34" height="12" fill="#E8C9A0"/>
      <rect x="548" y="690" width="42" height="12" fill="#E8C9A0"/>
