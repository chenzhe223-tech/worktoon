    <rect x="42" y="484" width="10" height="70" fill="#C9A988"/>
    <rect x="158" y="484" width="10" height="70" fill="#C9A988"/>
    <rect x="70" y="438" width="60" height="34" rx="4" fill="#8A9BA6"/>
