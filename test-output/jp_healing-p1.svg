<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFD8E8"/>
      <stop offset="0.7" stop-color="#E8EEEA"/>
      <stop offset="1" stop-color="#FDF3E3"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8D9BF"/>
      <stop offset="1" stop-color="#D9C3A0"/>
    </linearGradient>
    <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7EBD5"/>
      <stop offset="1" stop-color="#EFE0C6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9F2EC"/>
      <stop offset="1" stop-color="#D6E6DC"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6DF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF6DF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="greenRow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8C3A0"/>
      <stop offset="1" stop-color="#C4D8BD"/>
    </linearGradient>
    <clipPath id="winClip">
      <rect x="70" y="90" width="660" height="330" rx="6"/>
    </clipPath>
    <clipPath id="screenClip">
      <rect x="382" y="600" width="236" height="150" rx="4"/>
    </clipPath>
  </defs>

  <!-- background -->
