    <ellipse cx="440" cy="352" rx="16" ry="9" fill="#A8C3A0" transform="rotate(-35 440 352)"/>
    <ellipse cx="506" cy="348" rx="16" ry="9" fill="#8FB189" transform="rotate(30 506 348)"/>
    <ellipse cx="476" cy="336" rx="14" ry="8" fill="#A8C3A0" transform="rotate(-5 476 336)"/>
