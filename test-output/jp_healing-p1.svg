  <path d="M120 980 q60 -14 130 -6" stroke="#C9A988" stroke-width="4" fill="none" opacity="0.6"/>

  <!-- 小林 (mid-small in frame, seated, leaning forward) -->
  <g>
    <!-- legs under desk -->
    <path d="M352 780 q-6 40 -26 62" stroke="#4A4A52" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M392 780 q-4 42 -20 66" stroke="#4A4A52" stroke-width="20" fill="none" stroke-linecap="round"/>
    <ellipse cx="322" cy="848" rx="18" ry="8" fill="#3A2E24" stroke="#6B4F3A" stroke-width="2"/>
    <ellipse cx="366" cy="852" rx="18" ry="8" fill="#3A2E24" stroke="#6B4F3A" stroke-width="2"/>
    <!-- torso leaning forward -->
    <path d="M346 690 q-14 50 4 92 q28 14 56 0 q18 -44 4 -94 q-32 -14 -64 2 Z" fill="#F6EEDC" stroke="#6B4F3A" stroke-width="3"/>
    <path d="M352 706 q28 -8 50 0 M350 724 q30 -8 54 0" stroke="#D9CBB0" stroke-width="2" fill="none"/>
    <!-- left arm resting on printed sheet -->
    <path d="M352 712 q-40 30 -72 44" stroke="#F6EEDC" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M352 712 q-40 30 -72 44" stroke="#6B4F3A" stroke-width="2" fill="none" opacity="0.35"/>
    <circle cx="278" cy="758" r="9" fill="#F2C9A8" stroke="#6B4F3A" stroke-width="2"/>
    <!-- right arm to mouse -->
    <path d="M404 716 q48 36 96 66" stroke="#F6EEDC" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M404 716 q48 36 96 66" stroke="#6B4F3A" stroke-width="2" fill="none" opacity="0.35"/>
    <circle cx="506" cy="790" r="10" fill="#F2C9A8" stroke="#6B4F3A" stroke-width="2"/>
    <!-- neck + head, slight tilt toward screen -->
    <rect x="368" y="662" width="16" height="22" fill="#F2C9A8" stroke="#6B4F3A" stroke-width="2.5"/>
    <g transform="rotate(4 384 640)">
      <!-- face -->
      <path d="M356 626 q-2 -38 28 -42 q30 4 28 42 q0 26 -28 34 q-28 -8 -28 -34 Z" fill="#F2C9A8" stroke="#6B4F3A" stroke-width="3"/>
      <!-- hair: side-parted bob -->
      <path d="M352 628 q-8 -52 32 -56 q42 4 34 56 q2 20 -4 30 q6 -34 -8 -48 q-6 10 -22 10 q-16 -2 -20 -8 q-12 12 -8 46 q-6 -12 -4 -30 Z" fill="#5A4636" stroke="#6B4F3A" stroke-width="3"/>
      <path d="M356 596 q-6 16 -4 40" stroke="#7A614C" stroke-width="2.5" fill="none"/>
      <!-- glasses -->
      <circle cx="372" cy="630" r="9" fill="#FFFFFF" fill-opacity="0.35" stroke="#6B4F3A" stroke-width="1.8"/>
      <circle cx="396" cy="630" r="9" fill="#FFFFFF" fill-opacity="0.35" stroke="#6B4F3A" stroke-width="1.8"/>
      <line x1="381" y1="630" x2="387" y2="630" stroke="#6B4F3A" stroke-width="1.8"/>
      <!-- focused eyes (slight frown) -->
      <path d="M367 626 q5 -3 10 0" stroke="#3A2E24" stroke-width="2.2" fill="none"/>
      <path d="M391 626 q5 -3 10 0" stroke="#3A2E24" stroke-width="2.2" fill="none"/>
      <circle cx="372" cy="631" r="2.4" fill="#3A2E24"/>
      <circle cx="396" cy="631" r="2.4" fill="#3A2E24"/>
      <!-- brow furrow -->
      <path d="M364 618 q8 -4 15 -1 M389 617 q7 -3 15 1" stroke="#5A4636" stroke-width="2.2" fill="none"/>
      <!-- nose and mouth -->
      <path d="M384 636 q2 4 -1 6" stroke="#C99772" stroke-width="1.8" fill="none"/>
      <path d="M379 648 q5 2 10 0" stroke="#B0785A" stroke-width="2" fill="none"/>
      <!-- ear -->
      <path d="M356 632 q-6 2 -4 10 q2 6 8 4" fill="#F2C9A8" stroke="#6B4F3A" stroke-width="2"/>
    </g>
  </g>
