  <!-- foreground: blurred plant leaves corner -->
  <g opacity="0.85">
    <path d="M-10 1000 q60 -160 40 -240" stroke="#8FB189" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M30 1000 q80 -130 60 -220" stroke="#A8C3A0" stroke-width="13" fill="none" stroke-linecap="round"/>
    <ellipse cx="36" cy="742" rx="34" ry="16" fill="#A8C3A0" transform="rotate(-40 36 742)"/>
    <ellipse cx="86" cy="772" rx="30" ry="14" fill="#8FB189" transform="rotate(-15 86 772)"/>
    <ellipse cx="60" cy="820" rx="28" ry="13" fill="#C4D8BD" transform="rotate(-55 60 820)"/>
  </g>
