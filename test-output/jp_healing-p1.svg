    <rect x="532" y="235" width="10" height="10" fill="#E8D8B8"/>
    <rect x="552" y="235" width="10" height="10" fill="#E8D8B8"/>
    <rect x="532" y="255" width="10" height="10" fill="#E8D8B8"/>
    <rect x="552" y="255" width="10" height="10" fill="#E8D8B8"/>
    <rect x="532" y="275" width="10" height="10" fill="#E8D8B8"/>
