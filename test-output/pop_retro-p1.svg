<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE3F0"/>
      <stop offset="1" stop-color="#EAF6FA"/>
    </linearGradient>
    <pattern id="halftone" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#171717" opacity="0.18"/>
    </pattern>
    <pattern id="halftonePink" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#E8347C" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- background base -->
  <rect x="0" y="0" width="800" height="1000" fill="#FFF6D8"/>

  <!-- BACKDROP WALL -->
  <rect x="0" y="0" width="800" height="560" fill="#FFF6D8"/>
  <rect x="0" y="560" width="800" height="440" fill="#F4E6BE"/>
  <rect x="0" y="560" width="800" height="440" fill="url(#halftone)"/>

  <!-- window wall -->
  <rect x="40" y="60" width="430" height="430" fill="url(#win)" stroke="#171717" stroke-width="8"/>
  <line x1="185" y1="60" x2="185" y2="490" stroke="#171717" stroke-width="7"/>
  <line x1="330" y1="60" x2="330" y2="490" stroke="#171717" stroke-width="7"/>
  <line x1="40" y1="275" x2="470" y2="275" stroke="#171717" stroke-width="7"/>
  <!-- city skyline -->
  <g fill="#9FC9DB" stroke="#171717" stroke-width="4">
    <rect x="60" y="190" width="60" height="85"/>
    <rect x="130" y="150" width="45" height="125"/>
    <rect x="215" y="210" width="55" height="65"/>
    <rect x="290" y="120" width="50" height="155"/>
    <rect x="355" y="180" width="65" height="95"/>
    <rect x="425" y="230" width="40" height="45"/>
  </g>
  <g fill="#FFF6D8" opacity="0.7">
    <rect x="70" y="205" width="10" height="10"/><rect x="95" y="230" width="10" height="10"/>
    <rect x="140" y="170" width="10" height="10"/><rect x="150" y="215" width="10" height="10"/>
    <rect x="300" y="140" width="10" height="10"/><rect x="320" y="185" width="10" height="10"/>
    <rect x="370" y="200" width="10" height="10"/><rect x="230" y="225" width="10" height="10"/>
  </g>
  <!-- pink accent curtain right of window -->
  <rect x="470" y="40" width="70" height="470" fill="#E8347C" stroke="#171717" stroke-width="8"/>
  <path d="M480 40 q20 120 0 240 q20 120 0 230" fill="none" stroke="#171717" stroke-width="5"/>
  <rect x="470" y="40" width="70" height="120" fill="url(#halftonePink)"/>

  <!-- far shelf back wall -->
  <rect x="580" y="120" width="190" height="16" fill="#171717"/>
  <rect x="580" y="250" width="190" height="16" fill="#171717"/>
  <g stroke="#171717" stroke-width="5">
    <rect x="600" y="60" width="40" height="58" fill="#4E7CBF"/>
    <rect x="655" y="70" width="34" height="48" fill="#E8347C"/>
    <rect x="705" y="55" width="42" height="63" fill="#F2B21A"/>
    <rect x="605" y="190" width="45" height="58" fill="#E8347C"/>
    <rect x="665" y="200" width="36" height="48" fill="#4E7CBF"/>
    <rect x="715" y="185" width="40" height="63" fill="#F2B21A"/>
  </g>
  <!-- plant far -->
  <ellipse cx="745" cy="545" rx="26" ry="20" fill="#E8347C" stroke="#171717" stroke-width="6"/>
  <path d="M745 545 C720 500 700 510 715 470 M745 545 C745 495 770 500 775 455 M745 545 C765 510 795 520 790 480" fill="none" stroke="#2E7D46" stroke-width="9" stroke-linecap="round"/>

  <!-- wall clock (no numerals) -->
  <circle cx="545" cy="330" r="42" fill="#FFF6D8" stroke="#171717" stroke-width="7"/>
  <line x1="545" y1="330" x2="545" y2="305" stroke="#171717" stroke-width="5"/>
  <line x1="545" y1="330" x2="562" y2="338" stroke="#171717" stroke-width="5"/>

  <!-- FLOOR -->
  <rect x="0" y="880" width="800" height="120" fill="#E3D2A2"/>
  <line x1="0" y1="880" x2="800" y2="880" stroke="#171717" stroke-width="7"/>

  <!-- DISTANT WORKSTATION (background, simplified) -->
  <g stroke="#171717" stroke-width="5" opacity="0.85">
    <rect x="560" y="700" width="180" height="14" fill="#B98A4E"/>
    <rect x="575" y="714" width="14" height="170" fill="#8A6236"/>
    <rect x="712" y="714" width="14" height="170" fill="#8A6236"/>
    <rect x="610" y="630" width="90" height="62" fill="#2B2B2B"/>
    <rect x="618" y="638" width="74" height="42" fill="#5B8FBF"/>
  </g>
  <!-- distant chair blob -->
  <g opacity="0.85" stroke="#171717" stroke-width="5" fill="#E8347C">
    <rect x="585" y="760" width="70" height="16" rx="8"/>
    <rect x="610" y="776" width="12" height="70"/>
    <ellipse cx="616" cy="856" rx="34" ry="10"/>
  </g>

  <!-- MAIN DESK (middle ground) -->
  <g>
    <rect x="110" y="720" width="420" height="26" fill="#B98A4E" stroke="#171717" stroke-width="8"/>
    <rect x="125" y="746" width="20" height="200" fill="#8A6236" stroke="#171717" stroke-width="7"/>
    <rect x="495" y="746" width="20" height="200" fill="#8A6236" stroke="#171717" stroke-width="7"/>
    <rect x="360" y="746" width="120" height="70" fill="#9A7040" stroke="#171717" stroke-width="7"/>
    <line x1="360" y1="781" x2="480" y2="781" stroke="#171717" stroke-width="5"/>
    <circle cx="420" cy="764" r="6" fill="#171717"/>
  </g>

  <!-- MONITOR with three quotation spreadsheets (FOCAL POINT) -->
  <g>
    <ellipse cx="320" cy="560" rx="180" ry="30" fill="#F2B21A" opacity="0.55"/>
    <rect x="185" y="520" width="270" height="180" rx="10" fill="#171717"/>
    <rect x="198" y="532" width="244" height="150" fill="#FFF6D8"/>
    <!-- spreadsheet A -->
    <g>
      <rect x="206" y="542" width="70" height="130" fill="#FFF" stroke="#171717" stroke-width="3"/>
      <rect x="206" y="542" width="70" height="16" fill="#4E7CBF" stroke="#171717" stroke-width="3"/>
      <g stroke="#171717" stroke-width="2">
        <line x1="206" y1="575" x2="276" y2="575"/><line x1="206" y1="600" x2="276" y2="600"/>
        <line x1="206" y1="625" x2="276" y2="625"/><line x1="206" y1="650" x2="276" y2="650"/>
        <line x1="238" y1="558" x2="238" y2="672"/>
      </g>
      <rect x="206" y="650" width="70" height="12" fill="#E8347C" opacity="0.55"/>
    </g>
    <!-- spreadsheet B -->
    <g>
      <rect x="285" y="542" width="70" height="130" fill="#FFF" stroke="#171717" stroke-width="3"/>
      <rect x="285" y="542" width="70" height="16" fill="#E8347C" stroke="#171717" stroke-width="3"/>
      <g stroke="#171717" stroke-width="2">
        <line x1="285" y1="575" x2="355" y2="575"/><line x1="285" y1="600" x2="355" y2="600"/>
        <line x1="285" y1="625" x2="355" y2="625"/><line x1="285" y1="650" x2="355" y2="650"/>
        <line x1="317" y1="558" x2="317" y2="672"/>
      </g>
      <rect x="285" y="650" width="70" height="12" fill="#E8347C" opacity="0.55"/>
    </g>
    <!-- spreadsheet C -->
    <g>
      <rect x="364" y="542" width="70" height="130" fill="#FFF" stroke="#171717" stroke-width="3"/>
      <rect x="364" y="542" width="70" height="16" fill="#F2B21A" stroke="#171717" stroke-width="3"/>
      <g stroke="#171717" stroke-width="2">
        <line x1="364" y1="575" x2="434" y2="575"/><line x1="364" y1="600" x2="434" y2="600"/>
        <line x1="364" y1="625" x2="434" y2="625"/><line x1="364" y1="650" x2="434" y2="650"/>
        <line x1="396" y1="558" x2="396" y2="672"/>
      </g>
      <rect x="364" y="650" width="70" height="12" fill="#E8347C" opacity="0.55"/>
    </g>
    <!-- stand -->
    <rect x="300" y="700" width="30" height="22" fill="#171717"/>
    <ellipse cx="315" cy="722" rx="55" ry="9" fill="#171717"/>
  </g>

  <!-- printed sheets on desk -->
  <g stroke="#171717" stroke-width="4">
    <polygon points="150,700 235,690 243,716 158,726" fill="#FFF6D8"/>
    <polygon points="165,690 245,680 252,704 172,714" fill="#FFF" />
    <g stroke-width="2">
      <line x1="180" y1="695" x2="232" y2="690"/>
      <line x1="182" y1="703" x2="234" y2="698"/>
    </g>
  </g>
  <!-- calculator -->
  <g stroke="#171717" stroke-width="4">
    <rect x="470" y="690" width="62" height="40" rx="5" fill="#2B2B2B"/>
    <rect x="478" y="696" width="46" height="12" fill="#9FD8B8"/>
    <g fill="#FFF6D8" stroke-width="2">
      <rect x="480" y="714" width="8" height="7"/><rect x="492" y="714" width="8" height="7"/>
      <rect x="504" y="714" width="8" height="7"/><rect x="516" y="714" width="8" height="7"/>
    </g>
  </g>
  <!-- coffee mug -->
  <path d="M130 668 h34 v30 a17 17 0 0 1 -34 0 z" fill="#E8347C" stroke="#171717" stroke-width="5"/>
  <path d="M164 674 q16 4 0 18" fill="none" stroke="#171717" stroke-width="5"/>
  <!-- mouse & cable -->
  <ellipse cx="430" cy="700" rx="18" ry="12" fill="#FFF" stroke="#171717" stroke-width="5"/>
  <path d="M448 696 q30 -10 40 6" fill="none" stroke="#171717" stroke-width="4"/>

  <!-- XIAOLIN (seated, leaning forward) -->
  <g>
    <!-- chair -->
    <rect x="140" y="640" width="14" height="160" fill="#171717"/>
    <rect x="120" y="560" width="90" height="150" rx="20" fill="#4E7CBF" stroke="#171717" stroke-width="8"/>
    <!-- legs under desk -->
    <path d="M210 790 L205 890 L228 890 L232 800 Z" fill="#3D4450" stroke="#171717" stroke-width="7"/>
    <path d="M255 780 L262 890 L285 890 L276 795 Z" fill="#3D4450" stroke="#171717" stroke-width="7"/>
    <ellipse cx="216" cy="896" rx="24" ry="9" fill="#171717"/>
    <ellipse cx="274" cy="896" rx="24" ry="9" fill="#171717"/>
    <!-- torso leaning forward -->
    <path d="M215 620 C215 660 205 700 215 740 C230 775 285 780 300 745 C308 715 300 660 292 625 Z" fill="#F7EEDC" stroke="#171717" stroke-width="8"/>
    <path d="M225 660 q30 12 58 0 M222 690 q34 14 62 0" fill="none" stroke="#C9B98F" stroke-width="4"/>
    <!-- left arm reaching to papers -->
    <path d="M220 640 C190 650 165 665 155 690" fill="none" stroke="#171717" stroke-width="22" stroke-linecap="round"/>
    <path d="M220 640 C190 650 165 665 155 690" fill="none" stroke="#F7EEDC" stroke-width="14" stroke-linecap="round"/>
    <circle cx="152" cy="696" r="13" fill="#F2C9A8" stroke="#171717" stroke-width="5"/>
    <!-- right arm to mouse -->
    <path d="M295 645 C325 655 370 665 415 688" fill="none" stroke="#171717" stroke-width="22" stroke-linecap="round"/>
    <path d="M295 645 C325 655 370 665 415 688" fill="none" stroke="#F7EEDC" stroke-width="14" stroke-linecap="round"/>
    <circle cx="424" cy="694" r="13" fill="#F2C9A8" stroke="#171717" stroke-width="5"/>
    <!-- neck & head, tilted down toward screen -->
    <rect x="243" y="595" width="26" height="30" fill="#F2C9A8" stroke="#171717" stroke-width="6"/>
    <ellipse cx="258" cy="545" rx="55" ry="60" fill="#F2C9A8" stroke="#171717" stroke-width="8"/>
    <!-- side-part bob hair -->
    <path d="M203 545 C200 495 225 470 258 470 C295 470 315 495 313 540 C313 555 308 565 304 572 C306 545 298 525 288 515 C270 535 235 540 215 528 C207 540 206 560 208 575 C204 565 203 556 203 545 Z" fill="#4A3320" stroke="#171717" stroke-width="7"/>
    <path d="M203 548 C202 580 206 595 212 605 L200 605 C197 585 198 565 203 548 Z" fill="#4A3320" stroke="#171717" stroke-width="7"/>
    <path d="M313 545 C315 578 310 596 304 608 L315 608 C319 588 318 563 313 545 Z" fill="#4A3320" stroke="#171717" stroke-width="7"/>
    <!-- glasses -->
    <g stroke="#171717" stroke-width="5" fill="#FFF" fill-opacity="0.55">
      <rect x="215" y="538" width="34" height="26" rx="6"/>
      <rect x="262" y="538" width="34" height="26" rx="6"/>
    </g>
    <line x1="249" y1="550" x2="262" y2="550" stroke="#171717" stroke-width="4"/>
    <!-- focused frowning eyes -->
    <line x1="224" y1="550" x2="240" y2="551" stroke="#171717" stroke-width="4"/>
    <circle cx="233" cy="553" r="3.5" fill="#171717"/>
    <line x1="272" y1="551" x2="288" y2="550" stroke="#171717" stroke-width="4"/>
    <circle cx="280" cy="553" r="3.5" fill="#171717"/>
    <!-- frown brows -->
    <path d="M218 534 L242 540 M296 534 L272 540" fill="none" stroke="#171717" stroke-width="6" stroke-linecap="round"/>
    <!-- nose & mouth -->
    <path d="M258 560 L255 570 L261 572" fill="none" stroke="#171717" stroke-width="4"/>
    <line x1="248" y1="583" x2="268" y2="583" stroke="#171717" stroke-width="5"/>
  </g>

  <!-- FOREGROUND: stacked folders bottom-left, big framing -->
  <g stroke="#171717" stroke-width="7">
    <rect x="10" y="900" width="220" height="100" fill="#4E7CBF"/>
    <rect x="30" y="880" width="220" height="100" fill="#E8347C"/>
    <rect x="50" y="860" width="220" height="100" fill="#F2B21A"/>
    <path d="M50 860 l40 -24 h220 l-40 24 Z" fill="#F6CE5A"/>
    <path d="M270 860 l40 -24 v100 l-40 24 Z" fill="#D89A0E"/>
  </g>
  <rect x="50" y="860" width="220" height="100" fill="url(#halftonePink)"/>
  <!-- foreground plant leaf corner -->
  <path d="M790 1000 C760 900 800 860 770 790 M790 1000 C820 900 790 870 810 800" fill="none" stroke="#2E7D46" stroke-width="14" stroke-linecap="round"/>
  <path d="M770 790 q30 -18 48 -6 M810 800 q-6 -30 12 -44" fill="none" stroke="#2E7D46" stroke-width="9" stroke-linecap="round"/>

  <!-- window light beam toward desk -->
  <polygon points="180,490 420,490 470,700 250,700" fill="#FFF6D8" opacity="0.35"/>
</svg>